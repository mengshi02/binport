    <svg id="screen" width="944" height="408" x="23" y="50" viewBox="0 0 944 408" preserveAspectRatio="xMidYMin slice"><rect class="background" height="100%" width="100%" x="0" y="0"/><defs><g id="g1"><text x="0" textLength="8" class="background"> </text></g><g id="g2"><text x="0" textLength="368" font-weight="bold" class="color13">Your tools. Any server. Even behind a bastion.</text></g><g id="g3"><text x="0" textLength="480" class="foreground">Native Rust SSH &#183; zero remote installs &#183; no external ssh/scp</text></g><g id="g4"><text x="0" textLength="8" font-weight="bold" class="color14">&#10095;</text><text x="8" textLength="192" class="foreground"> binport bastion presets</text></g><g id="g5"><text x="0" textLength="48" class="foreground">PRESET</text><text x="64" textLength="48" class="foreground">FORMAT</text><text x="128" textLength="56" class="foreground">PRODUCT</text><text x="192" textLength="48" class="foreground">STATUS</text></g><g id="g6"><text x="0" textLength="120" class="foreground">h3c-iware-slash</text><text x="128" textLength="184" class="foreground">{user}/{host}/{account}</text><text x="320" textLength="80" class="foreground">H3C i-Ware</text><text x="448" textLength="152" class="foreground">deployment-verified</text></g><g id="g7"><text x="0" textLength="104" class="foreground">huawei-cbh-at</text><text x="128" textLength="184" class="foreground">{user}@{account}@{host}</text><text x="320" textLength="128" class="foreground">Huawei Cloud CBH</text><text x="512" textLength="136" class="foreground">vendor-documented</text></g><g id="g8"><text x="0" textLength="144" class="foreground">jumpserver-koko-at</text><text x="192" textLength="184" class="foreground">{user}@{account}@{host}</text><text x="384" textLength="120" class="foreground">JumpServer/Koko</text><text x="512" textLength="144" class="foreground">community-reported</text></g><g id="g9"><text x="0" textLength="176" class="foreground">oneidentity-sps-inband</text><text x="192" textLength="128" class="foreground">{account}@{host}</text><text x="384" textLength="128" class="foreground">One Identity SPS</text><text x="576" textLength="136" class="foreground">vendor-documented</text></g><g id="g10"><text x="0" textLength="160" class="foreground">wallix-bastion-shell</text><text x="192" textLength="216" class="foreground">{account}@{host}:SSH:{user}</text><text x="448" textLength="112" class="foreground">WALLIX Bastion</text><text x="576" textLength="136" class="foreground">vendor-documented</text></g><g id="g11"><text x="0" textLength="128" class="foreground">cyberark-psmp-at</text><text x="192" textLength="184" class="foreground">{user}@{account}@{host}</text><text x="384" textLength="104" class="foreground">CyberArk PSMP</text><text x="512" textLength="144" class="foreground">community-reported</text></g><g id="g12"><text x="0" textLength="8" font-weight="bold" class="color14">&#10095;</text><text x="8" textLength="248" class="foreground"> binport bastion probe worker-a</text></g><g id="g13"><text x="0" textLength="200" class="foreground">Bastion capability report</text></g><g id="g14"><text x="0" textLength="208" class="foreground">  Host:           worker-a</text></g><g id="g15"><text x="0" textLength="320" class="foreground">  Bastion:        bastion.example.com:22</text></g><g id="g16"><text x="0" textLength="280" class="foreground">  Connection:     supported (27 ms)</text></g><g id="g17"><text x="0" textLength="288" class="foreground">  Exec:           supported (481 ms)</text></g><g id="g18"><text x="0" textLength="232" class="foreground">  direct-tcpip:   not-checked</text></g><g id="g19"><text x="0" textLength="8" font-weight="bold" class="color14">&#10095;</text><text x="8" textLength="512" class="foreground"> binport --verbose worker-a rg "authentication timeout" /var/log</text></g><g id="g20"><text x="0" textLength="720" class="foreground">binport: connected to operator@192.0.2.52:22 via bastion:bastion.example.com (linux/amd64)</text></g><g id="g21"><text x="0" textLength="152" class="foreground">binport: cache miss</text></g><g id="g22"><text x="0" textLength="616" class="foreground">/var/log:2:2026-08-25T07:10:13Z WARN authentication timeout upstream=identity</text></g><g id="g23"><text x="0" textLength="616" class="foreground">/var/log:4:2026-08-25T07:10:16Z WARN authentication timeout upstream=identity</text></g><g id="g24"><text x="0" textLength="144" class="foreground">binport: cache hit</text></g><g id="g25"><text x="0" textLength="8" font-weight="bold" class="color14">&#10095;</text><text x="8" textLength="352" class="foreground"> binport tunnel 8080:127.0.0.1:3000 worker-a</text></g><g id="g26"><text x="0" textLength="336" class="foreground">Tunneling 127.0.0.1:8080 -&gt; 127.0.0.1:3000</text></g><g id="g27"><text x="0" textLength="8" font-weight="bold" class="color14">&#10095;</text><text x="8" textLength="240" class="foreground"> curl -s http://127.0.0.1:8080</text></g><g id="g28"><text x="0" textLength="312" class="foreground">private service reached through binport</text></g><g id="g29"><text x="0" textLength="432" class="color2">No binport agent. No package install. Just your tools.</text></g></defs><g id="screen_view"><g><rect x="0" y="0" width="8" height="17" class="foreground"/><use xlink:href="#g1" y="0"/></g><g><use xlink:href="#g2" y="442"/><use xlink:href="#g3" y="459"/><rect x="0" y="493" width="8" height="17" class="foreground"/><use xlink:href="#g1" y="493"/></g><g><use xlink:href="#g2" y="884"/><use xlink:href="#g3" y="901"/><use xlink:href="#g4" y="935"/><rect x="0" y="952" width="8" height="17" class="foreground"/><use xlink:href="#g1" y="952"/></g><g><use xlink:href="#g2" y="1326"/><use xlink:href="#g3" y="1343"/><use xlink:href="#g4" y="1377"/><use xlink:href="#g5" y="1394"/><use xlink:href="#g6" y="1411"/><use xlink:href="#g7" y="1428"/><use xlink:href="#g8" y="1445"/><use xlink:href="#g9" y="1462"/><use xlink:href="#g10" y="1479"/><use xlink:href="#g11" y="1496