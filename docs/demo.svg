56.415%{transform:translateY(-3060px)}
59.042%{transform:translateY(-3400px)}
59.056%{transform:translateY(-3740px)}
72.704%{transform:translateY(-4080px)}
86.352%{transform:translateY(-4420px)}
100.000%{transform:translateY(-4420px)}
            }

            #screen_view {
                animation-duration: 14654ms;
                animation-iteration-count:infinite;
                animation-name:roll;
                animation-timing-function: steps(1,end);
                animation-fill-mode: forwards;
            }
        ]]></style>
