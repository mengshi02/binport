name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked
      - name: Run tests
        run: cargo test --all-features --locked
      - name: Validate PowerShell installer
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content install.ps1 -Raw)) | Out-Null
      - name: Build release binary
        run: cargo build --release --locked
      - name: Upload Linux validation binaries
        uses: actions/upload-artifact@v7
        with:
          name: binport-linux-validation
          path: |
            target/release/binport
            target/release/binport-hop
          if-no-files-found: error
      - name: Run native SSH end-to-end test
        env:
          BINPORT_BIN: ${{ github.workspace }}/target/release/binport
          BINPORT_HOP_BIN: ${{ github.workspace }}/target/release/binport-hop
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes openssh-server
          sudo mkdir -p /run/sshd
          sh tests/ssh-e2e.sh

  windows:
    name: Windows compile and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Check Windows client
        run: cargo check --all-targets --all-features --locked
      - name: Run tests
        run: cargo test --all-features --locked
