name: Bug report
description: Report reproducible incorrect behavior in binport
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, tokens, private keys, or sensitive host details.
  - type: input
    id: version
    attributes:
      label: binport version
      placeholder: binport 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Local platform
      options:
        - Linux amd64
        - Linux arm64
        - macOS amd64
        - macOS arm64
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the command, expected result, and actual result using sanitized values.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      render: shell
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Sanitized logs, SSH route shape, remote OS/architecture, or Registry type.
