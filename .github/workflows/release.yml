name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - name: darwin-amd64
            runner: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: windows-amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux arm64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package="binport-${{ matrix.name }}"
          mkdir -p "$package"
          cp "target/${{ matrix.target }}/release/binport" "$package/binport"
          cp LICENSE README.md "$package/"
          tar -czf "$package.tar.gz" "$package"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/binport.exe" --version
          $package = "binport-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/binport.exe" "$package/binport.exe"
          Copy-Item LICENSE, README.md, README.zh-CN.md $package
          Compress-Archive -Path $package -DestinationPath "$package.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: binport-${{ matrix.name }}
          path: binport-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches Cargo version
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/download-artifact@v8
        with:
          pattern: binport-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum binport-*.tar.gz binport-*.zip > SHA256SUMS
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/binport-*.tar.gz dist/binport-*.zip dist/SHA256SUMS --clobber
